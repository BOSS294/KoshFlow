[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koshflow"
version = "0.6.3"
description = "Local-first Indian business management desktop application with billing, PDF studio, inventory and purchasing workflows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7.0",
    "argon2-cffi>=23.1,<26.0",
    "reportlab>=4.2,<5.0",
    "Pillow>=10.0,<13.0",
]

[project.scripts]
koshflow = "koshflow.app:run"

[tool.setuptools.packages.find]
include = ["koshflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
