name: Build Windows executable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q koshflow main.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable Windows executable
        run: python -m PyInstaller --noconfirm --clean KoshFlow.spec

      - name: Verify executable artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/KoshFlow.exe")) {
            throw "Expected dist/KoshFlow.exe was not created."
          }
          Get-Item "dist/KoshFlow.exe" | Format-List Name, Length, LastWriteTime

      - name: Publish executable on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/KoshFlow.exe
